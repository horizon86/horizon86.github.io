<script>
// 转换函数
function convClick() {
    const cmd = document.getElementById("cmd").value.trim();
    if (!cmd) return;
    
    const args = cmd.split(/\s+/)
        .filter(arg => arg)
        .map(arg => `"${arg}"`)
        .reduce((acc, arg, index, arr) => {
            // 参数格式化：遇到--开头的换行加缩进
            return acc + (arg.startsWith('"--') ? 
                (index === 0 ? '' : ',\n    ') + arg : 
                (index === 0 ? '' : ', ') + arg);
        }, "");
    
    document.getElementById("args").textContent = args;
}

// 复制功能
function copyOutput() {
    const content = document.getElementById("args").textContent;
    if (!content) return;
    
    navigator.clipboard.writeText(content).then(() => {
        const btn = document.querySelector('.copy-btn');
        if (!btn) return;
        
        // 显示复制成功反馈
        btn.innerHTML = `
            <svg class="copy-icon" viewBox="0 0 24 24" style="fill: #40c057;">
                <path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z" />
            </svg>
        `;
        btn.title = "已复制！";
        
        setTimeout(() => {
            btn.innerHTML = `
                <svg class="copy-icon" viewBox="0 0 24 24">
                    <path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z" />
                </svg>
            `;
            btn.title = "复制到剪贴板";
        }, 2000);
    }).catch(err => {
        console.error('复制失败:', err);
    });
}

// 添加回车键触发转换
document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById("cmd");
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            convClick();
        }
    });
});
</script>

      includeTitleTags: true,
      headingsOffset  : -boardTop,
    }, CONFIG.toc));
    if (toc.find('.toc-list-item').length > 0) {
      toc.css('visibility', 'visible');
    }

    Fluid.events.registerRefreshCallback(function() {
      if ('tocbot' in window) {
        tocbot.refresh();
        var toc = jQuery('#toc');
        if (toc.length === 0 || !tocbot) {
          return;

        if (toc.find('.toc-list-item').length > 0) {
          toc.css('visibility', 'visible');
        }
      }
    });

  Fluid.utils.createScript('https://lib.baomitu.com/anchor-js/4.3.1/anchor.min.js', function() {
    window.anchors.options = {
      placement: CONFIG.anchorjs.placement,
      visible  : CONFIG.anchorjs.visible
    };
    if (CONFIG.anchorjs.icon) {
      window.anchors.options.icon = CONFIG.anchorjs.icon;
    }
    var el = (CONFIG.anchorjs.element || 'h1,h2,h3,h4,h5,h6').split(',');
    var res = [];
    for (var item of el) {
      res.push('.markdown-body > ' + item.trim());
    }
    if (CONFIG.anchorjs.placement === 'left') {
      window.anchors.options.class = 'anchorjs-link-left';
    }
    window.anchors.add(res.join(', '));

    Fluid.events.registerRefreshCallback(function() {
      if ('anchors' in window) {
        anchors.removeAll();
        var el = (CONFIG.anchorjs.element || 'h1,h2,h3,h4,h5,h6').split(',');
        var res = [];
        for (var item of el) {
          res.push('.markdown-body > ' + item.trim());
        }
        if (CONFIG.anchorjs.placement === 'left') {
          anchors.options.class = 'anchorjs-link-left';
        }
        anchors.add(res.join(', '));
      }
    });
  });
</script>
